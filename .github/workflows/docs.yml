name: Documentation

on:
  workflow_dispatch:
  # Only when something the site is built from changes: the site is not rebuilt for
  # code-only changes. The weekly schedule below still checks links every week.
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "Config/Config.py"
      - "__main__.py"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "Config/Config.py"
      - "__main__.py"
  schedule:
    # Weekly, to catch links to other websites that went dead.
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  docs:
    name: Docs
    permissions:
      contents: read
      pages: write
      id-token: write
    # The build, the checks and the deployment are shared by all the documentation sites.
    uses: boxboxjason/hugo-theme/.github/workflows/docs.yml@b0b783694aa719b11bd004274bdf6c0c52b70367 # main, same commit as docs/go.mod
    with:
      deploy: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      check-external-links: ${{ github.event_name == 'schedule' }}

  drift:
    name: Docs cover the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the configuration options and output files are documented
        run: python3 -I docs/check_docs.py
