name: Documentation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly, to catch links to other websites that went dead.
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  docs:
    name: Docs
    permissions:
      contents: read
      pages: write
      id-token: write
    # The build, the checks and the deployment are shared by all the documentation sites.
    uses: boxboxjason/hugo-theme/.github/workflows/docs.yml@0a87a434dbb103054c54db9adbde295b6f5d3f00 # main, same commit as docs/go.mod
    with:
      deploy: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      check-external-links: ${{ github.event_name == 'schedule' }}

  drift:
    name: Docs cover the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the configuration options and output files are documented
        run: python3 -I docs/check_docs.py
