baseURL = "https://boxboxjason.github.io/instagram-stats/"
title = "instagram-stats"
locale = "en-US"

# "Last updated" dates on pages come from git history, so CI must check out all of it.
enableGitInfo = true
enableRobotsTXT = true

# Hugo does not merge `markup` from a theme: keep this block in every site.
[markup]
  [markup.highlight]
    noClasses = false

# Look and feel (colours, favicon, footer, search, ...) come from the shared theme,
# which is the same for every documentation site. Only project specifics live here.
[module]
  [[module.imports]]
    path = "github.com/boxboxjason/hugo-theme"

[menu]
  [[menu.main]]
    name = "Documentation"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Search"
    weight = 2
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    weight = 3
    url = "https://github.com/boxboxjason/instagram-stats"
    [menu.main.params]
      icon = "github"

[params]
  description = "instagram-stats turns your Instagram message export into graphs and rankings of who talks most, when and with which words."
  images = ["images/social.png"]
  [params.project]
    repository = "https://github.com/boxboxjason/instagram-stats"
    programmingLanguage = "Python"
  [params.editURL]
    base = "https://github.com/boxboxjason/instagram-stats/edit/main/docs/content"
